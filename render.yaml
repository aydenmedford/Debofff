services:
  - type: web
    name: deobf-web
    runtime: python
    plan: free
    buildCommand: unzip -o Deobf_Render_Ready.zip && pip install -r requirements.txt
    startCommand: gunicorn web.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
